name: Platen Scraper & Dashboard Build

on:
  schedule:
    - cron: '0 8 * * *'  # Draait elke dag om 8:00 uur 's ochtends
  workflow_dispatch:      # Hiermee kun je hem ook handmatig starten via GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Geeft GitHub Actions toestemming om bestanden te committen

    steps:
      - name: Code ophalen
        uses: actions/checkout@v3

      - name: Python instellen
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Dependencies installeren
        run: |
          pip install requests beautifulsoup4

      - name: Scraper draaien
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: python monitor.py

      - name: Wijzigingen (index.html & DB) opslaan en pushen
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html sounds_catalog.db
          git commit -m "Automatische update catalogus & dashboard [skip ci]" || exit 0
          git push
