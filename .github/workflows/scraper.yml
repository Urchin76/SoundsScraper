name: Sounds.nl Daily Scraper

on:
  schedule:
    - cron: '0 8 * * *'  # Elke dag om 08:00 UTC
  workflow_dispatch:      # Zorgt ervoor dat je het ook handmatig kunt testen

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Pakketten installeren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scraper uitvoeren
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: python monitor.py

      - name: Databank wijzigingen opslaan in repository
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f sounds_catalog.db ]; then
            git add sounds_catalog.db
            git diff-index --quiet HEAD || git commit -m "Automatische databank update [skip ci]"
            git push
          fi
